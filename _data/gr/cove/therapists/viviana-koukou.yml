name: Βιβιάνα Κούκου
role: Κοινωνική λειτουργός - Ψυχοθεραπεύτρια
image: /assets/images/therapist-viviana-koukou.jpg
alt: Βιβιάνα Κούκου
bio: >-
  Συνεργάτιδα του Therapy Cove. Ξεκινώντας από την ψυχική υποστήριξη προς
  ευάλωτους πληθυσμούς μέσα από συνεργασίες με ελληνικούς και διεθνείς
  οργανισμούς, σήμερα εργάζεται ως ψυχοθεραπεύτρια ενηλίκων συνθετικής
  προσέγγισης. Επιπλέον, έχει εκπαιδευτεί στην θεραπεία ψυχικού τραύματος
  συνοδεύοντας ανθρώπους που επιθυμούν να μπουν σε μια διαδικασία προσωπικής
  ανάλυσης και ψυχικής εμβάθυνσης, αλλά και σε πιο συγκεκριμένα αιτήματα, όπως
  ζητήματα σχέσεων, άγχους, ψυχικών διαταραχών, νευροαναπτυξιακών διαταραχών,
  και εσωτερικών συγκρούσεων.


  > *«Η ψυχοθεραπεία είναι ένας χώρος σχέσης, όπου η εμπειρία δεν είναι προκαθορισμένη αλλά συν-διαμορφώνεται, αποκτώντας κάθε φορά ένα διαφορετικό νόημα για το κάθε άτομο.»*
